name: Apply PR 717 Review Fixes

on:
  push:
    branches:
      - automation/pr717-review-fixes
    paths:
      - tools/apply_pr717_phase1.py
      - tools/apply_pr717_phase2.py
      - tools/apply_pr717_phase3_prod.py
      - tools/apply_pr717_phase3_import.py
      - tools/apply_pr717_phase3_main.py
      - tools/apply_pr717_phase3_guard.py
      - tools/apply_pr717_phase3_copy.py
      - tools/apply_pr717_phase3_tests.py
      - tools/apply_pr717_phase4.py
      - tools/apply_pr717_phase4_tests.py
      - .github/workflows/apply-pr717-review-fixes.yml
  pull_request:
    branches:
      - canary
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Test
      Playwright__Enabled: "false"
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Apply sparse-update fixes
        run: python tools/apply_pr717_phase1.py

      - name: Apply link-safe deletion fixes
        run: python tools/apply_pr717_phase2.py

      - name: Apply recovery marker persistence fixes
        run: python tools/apply_pr717_phase3_prod.py

      - name: Add recovery persistence imports
        run: python tools/apply_pr717_phase3_import.py

      - name: Apply recovery orchestration fixes
        run: python tools/apply_pr717_phase3_main.py

      - name: Harden marker manifest guard
        run: python tools/apply_pr717_phase3_guard.py

      - name: Apply manifest copy publication fixes
        run: python tools/apply_pr717_phase3_copy.py

      - name: Add recovery regression tests
        run: python tools/apply_pr717_phase3_tests.py

      - name: Apply transactional root reassignment fixes
        run: python tools/apply_pr717_phase4.py

      - name: Correct transactional rollback regression test
        run: python tools/apply_pr717_phase4_tests.py

      - name: Upload rendered patch diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rendered-pr717-source
          path: |
            listenarr.infrastructure/Library/Moving/AudiobookContentMoveService.cs
            listenarr.infrastructure/Library/Moving/AudiobookContentMoveService.Persistence.cs
            listenarr.infrastructure/Library/Moving/AudiobookContentMoveService.Recovery.cs
            tests/Features/Infrastructure/Persistence/RootFolderReassignmentTransactionTests.cs
          retention-days: 1

      - name: Remove temporary automation
        run: |
          rm tools/apply_pr717_phase1.py
          rm tools/apply_pr717_phase2.py
          rm tools/apply_pr717_phase3_prod.py
          rm tools/apply_pr717_phase3_import.py
          rm tools/apply_pr717_phase3_main.py
          rm tools/apply_pr717_phase3_guard.py
          rm tools/apply_pr717_phase3_copy.py
          rm tools/apply_pr717_phase3_tests.py
          rm tools/apply_pr717_phase4.py
          rm tools/apply_pr717_phase4_tests.py
          rm .github/workflows/apply-pr717-review-fixes.yml
          rm -f .github/workflows/render-pr717-patch.yml

      - name: Restore backend
        run: dotnet restore listenarr.slnx

      - name: Format backend changes
        run: dotnet format listenarr.slnx --no-restore

      - name: Build backend
        id: backend-build
        shell: bash
        run: |
          set +e
          dotnet build listenarr.slnx --no-restore --configuration Release --verbosity minimal > backend-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "(^|: )(error (CS|NU|NETSDK)[0-9]+|error :)" backend-build.log > backend-build-errors.txt || tail -n 250 backend-build.log > backend-build-errors.txt
            cat backend-build-errors.txt
          else
            cat backend-build.log
          fi
          exit "$status"

      - name: Upload backend build diagnostics
        if: failure() && steps.backend-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-errors
          path: backend-build-errors.txt
          if-no-files-found: error
          retention-days: 1

      - name: Run focused backend tests
        id: focused-tests
        shell: bash
        run: |
          set +e
          dotnet test tests/Listenarr.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=focused-tests.trx" \
            --filter "FullyQualifiedName~LibraryUpdateWorkflowTests|FullyQualifiedName~LibraryController_UpdateAudiobookTests|FullyQualifiedName~LibraryController_DeleteLinkSafetyTests|FullyQualifiedName~AudiobookContentMoveServiceTests|FullyQualifiedName~RootFolderReassignmentTransactionTests|FullyQualifiedName~RootFolderServiceTests|FullyQualifiedName~RootFolderRelocationServiceTests" \
            > focused-tests.log 2>&1
          status=$?
          cat focused-tests.log
          exit "$status"

      - name: Upload focused test diagnostics
        if: failure() && steps.focused-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: focused-test-errors
          path: |
            focused-tests.log
            tests/TestResults/focused-tests.trx
          if-no-files-found: warn
          retention-days: 1

      - name: Run complete backend suite
        run: dotnet test listenarr.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Install frontend dependencies
        working-directory: fe
        run: npm ci

      - name: Format frontend changes
        working-directory: fe
        run: npx prettier --write src/types/index.ts src/services/api.ts

      - name: Frontend type check
        working-directory: fe
        run: npm run type-check

      - name: Frontend unit tests
        working-directory: fe
        run: npm run test:unit

      - name: Frontend build
        working-directory: fe
        run: npm run build

      - name: Verify formatting and diff hygiene
        run: |
          dotnet format listenarr.slnx --no-restore --verify-no-changes
          git diff --check

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address PR 717 path safety review findings"
          git push origin HEAD:"${TARGET_BRANCH}"
