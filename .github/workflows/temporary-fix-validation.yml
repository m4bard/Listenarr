name: Temporary Fix Validation

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Apply recovery test expectation and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/Features/Infrastructure/Library/Moving/AudiobookContentMoveServiceTests.cs')
          text = path.read_text()
          if 'MoveContentsAsync_DirectCopyMarkerWithoutManifest_BlocksRecovery' not in text:
              pattern = re.compile(
                  r'        \[Fact\]\n'
                  r'        public async Task MoveContentsAsync_DirectCopyInterrupted_ResumesOwnedPartialTarget\(\)\n'
                  r'        \{.*?\n'
                  r'        \}\n\n'
                  r'        \[Fact\]\n'
                  r'        public async Task MoveContentsAsync_TargetInsideSource',
                  re.DOTALL)
              replacement = '''        [Fact]
          public async Task MoveContentsAsync_DirectCopyMarkerWithoutManifest_BlocksRecovery()
          {
              var source = FileService.GetTempDirectory("content-move-direct-retry-src");
              await FileService.GetFileAsync(source, "book.m4b", "complete audio");
              var target = FileService.GetTempDirectory("content-move-direct-retry-dst");
              await FileService.GetFileAsync(target, "book.m4b", "partial");
              var jobId = Guid.NewGuid();
              await File.WriteAllTextAsync(
                  Path.Join(target, $".listenarr-move-{jobId:N}.pending"),
                  "copy-started");

              var service = _provider.GetRequiredService<AudiobookContentMoveService>();
              var exception = await Assert.ThrowsAsync<MoveNeedsAttentionException>(() =>
                  service.MoveContentsAsync(
                      await CreateLeasedMoveRequestAsync(source, target, jobId),
                      CancellationToken.None));

              Assert.Contains("without a persisted manifest", exception.Message);
              Assert.True(Directory.Exists(source));
              Assert.Equal("partial", await File.ReadAllTextAsync(Path.Join(target, "book.m4b")));
          }

          [Fact]
          public async Task MoveContentsAsync_TargetInsideSource'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one recovery test block, replaced {count}')
              path.write_text(text)
          PY

          dotnet format
      - name: Commit mechanical fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m 'test(moves): reject recovery without persisted manifest'
          git push origin HEAD:${{ github.head_ref }}
      - name: Report formatter and compiler failures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          dotnet format --verify-no-changes --verbosity diagnostic > format.log 2>&1
          format_status=$?
          dotnet build --no-restore --nologo --verbosity minimal > build.log 2>&1
          build_status=$?

          {
            echo '<!-- temporary-fix-validation -->'
            echo '### Temporary fix validation'
            echo
            echo "Format exit code: \`$format_status\`"
            echo "Build exit code: \`$build_status\`"
            echo
            echo '<details><summary>Formatter diagnostics</summary>'
            echo
            echo '```text'
            grep -E '(Formatted|error|warning|Unable|Fix whitespace|Fix style|Fix analyzers|would be formatted|Files formatted)' format.log | tail -n 120 || tail -n 80 format.log
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>Compiler diagnostics</summary>'
            echo
            echo '```text'
            grep -E '(: error |error CS|error NETSDK|Build FAILED|Build succeeded)' build.log | tail -n 160 || tail -n 100 build.log
            echo '```'
            echo '</details>'
          } > diagnostics.md

          gh pr comment "$PR_NUMBER" --body-file diagnostics.md

          if [ "$format_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi
