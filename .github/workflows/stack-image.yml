# Builds a container from this fork's patched stack branch and publishes it to
# GHCR. Deliberately NOT upstream's canary.yml: that one also cuts a GitHub
# Release, which is noise on a fork, and publishes under the upstream image
# name.
#
# This file must only ever exist on the stack branch. If it reaches a branch
# that becomes a pull request, it follows the PR upstream.
name: stack image

on:
  push:
    branches: [ canary-m4bard ]
  workflow_dispatch:

concurrency:
  # A newer stack supersedes an older one; no point finishing a build nobody
  # will deploy.
  group: stack-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the stack manifest
        id: version
        run: |
          set -euo pipefail
          # Read it, do not recompute it. The checkout is shallow, so counting
          # commits against canary here silently yields zero and the image
          # claims to be a stock release. The manifest is written by the
          # publish step, which has the full history.
          test -f STACK-MANIFEST.md || {
            echo "::error::STACK-MANIFEST.md is missing; publish with tools/local_stack.sh"
            exit 1
          }
          value=$(grep -oP '(?<=version:)\s*\S+' STACK-MANIFEST.md | tr -d '[:space:]')
          test -n "$value" || { echo "::error::no version in STACK-MANIFEST.md"; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only. The deployment target is x86_64 and adding arm64 roughly
          # doubles the build for an image nothing else consumes.
          platforms: linux/amd64
          build-args: |
            LISTENARR_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/listenarr-m4bard:canary
            ghcr.io/${{ github.repository_owner }}/listenarr-m4bard:canary-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Listenarr (unofficial patched build)
            org.opencontainers.image.description=Upstream canary plus unmerged patches. Not a stock release. See STACK-MANIFEST.md in the image.
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what landed
        run: |
          echo "published ghcr.io/${{ github.repository_owner }}/listenarr-m4bard:canary"
          echo "  version reported by the app: ${{ steps.version.outputs.value }}"
          echo "  immutable tag: canary-m4bard-${{ steps.version.outputs.short_sha }}"
          echo "This is an UNOFFICIAL patched build. Do not use it to reproduce a bug for an upstream report."
