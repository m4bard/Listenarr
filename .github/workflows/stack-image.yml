# Builds a container from this fork's patched stack branch and publishes it to
# GHCR. Deliberately NOT upstream's canary.yml: that one also cuts a GitHub
# Release, which is noise on a fork, and publishes under the upstream image
# name.
#
# This file must only ever exist on the stack branch. If it reaches a branch
# that becomes a pull request, it follows the PR upstream.
name: stack image

on:
  push:
    branches: [ canary-m4bard ]
  workflow_dispatch:

concurrency:
  # A newer stack supersedes an older one; no point finishing a build nobody
  # will deploy.
  group: stack-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow depth-1 clone. The version-stamp
          # verification step below has to count commits back to the recorded base,
          # and a shallow clone would make that count silently wrong (see below).
          fetch-depth: 0

      - name: Read the version from the stack manifest
        id: version
        run: |
          set -euo pipefail
          # Read the declared version, but verify it against the real history before
          # trusting it -- the manifest is a file checked in by the publish step, and
          # nothing stops that step from being skipped. That happened for real: one
          # bake landed 13 more commits on top of another bake and republished with
          # the previous bake's untouched STACK-MANIFEST.md, so the image shipped the
          # same "1.3.4+m4bard.584" version stamp twice in a row despite having a
          # different, larger patch count each time. Nothing failed, because nothing
          # checked. This step is that check.
          test -f STACK-MANIFEST.md || {
            echo "::error::STACK-MANIFEST.md is missing; publish with tools/local_stack.sh"
            exit 1
          }
          value=$(grep -oP '(?<=version:)\s*\S+' STACK-MANIFEST.md | tr -d '[:space:]')
          test -n "$value" || { echo "::error::no version in STACK-MANIFEST.md"; exit 1; }

          declared_patches=$(grep -oP '(?<=patches:)\s*\S+' STACK-MANIFEST.md | tr -d '[:space:]')
          base_sha=$(grep -oP '(?<=^\s{4}base:)\s*\S+' STACK-MANIFEST.md | tr -d '[:space:]')
          test -n "$declared_patches" || { echo "::error::no patch count in STACK-MANIFEST.md"; exit 1; }
          test -n "$base_sha" || { echo "::error::no base sha in STACK-MANIFEST.md"; exit 1; }
          git cat-file -e "$base_sha" 2>/dev/null || {
            echo "::error::STACK-MANIFEST.md's base $base_sha is not reachable from this checkout (fetch-depth: 0 should have made it so)"
            exit 1
          }

          # The manifest records the patch count as it stood BEFORE the manifest-writing
          # commit itself was added (tools/local_stack.sh's publish step computes it, then
          # commits the file), so the real count one commit later is declared_patches + 1.
          actual_patches=$(( $(git rev-list --count "$base_sha..HEAD") - 1 ))
          if [ "$actual_patches" != "$declared_patches" ]; then
            echo "::error::STACK-MANIFEST.md says $declared_patches patches on $base_sha, but HEAD is actually $actual_patches past it. The manifest is stale -- regenerate it with tools/local_stack.sh (publish mode) before pushing, so the version stamp isn't ambiguous about which build this is."
            exit 1
          fi

          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only. The deployment target is x86_64 and adding arm64 roughly
          # doubles the build for an image nothing else consumes.
          platforms: linux/amd64
          build-args: |
            LISTENARR_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/listenarr-m4bard:current
            ghcr.io/${{ github.repository_owner }}/listenarr-m4bard:canary
            ghcr.io/${{ github.repository_owner }}/listenarr-m4bard:canary-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Listenarr (unofficial patched build)
            org.opencontainers.image.description=Upstream canary plus unmerged patches. Not a stock release. See STACK-MANIFEST.md in the image.
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what landed
        run: |
          echo "published ghcr.io/${{ github.repository_owner }}/listenarr-m4bard"
          echo "  moving tags:  current, canary"
          echo "  immutable:    canary-${{ steps.version.outputs.short_sha }}"
          echo "  stamped version: ${{ steps.version.outputs.value }}"
          echo "  NOTE: the running app truncates the +metadata and reports the base version."
          echo "  Pin a round by DIGEST, never by any of these tags."
          echo "This is an UNOFFICIAL patched build. Do not use it to reproduce a bug for an upstream report."
