name: Temporary Windows Test Diagnostics

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Run tests and report failure tail
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet test tests/Listenarr.Tests.csproj --no-restore --verbosity normal *> test.log
          $status = $LASTEXITCODE
          $tail = Get-Content test.log | Select-Object -Last 350
          @(
            '<!-- temporary-windows-test-diagnostics -->'
            '### Temporary Windows test diagnostics'
            ''
            "Exit code: ``$status``"
            ''
            '```text'
            $tail
            '```'
          ) | Set-Content diagnostics.md
          gh pr comment $env:PR_NUMBER --body-file diagnostics.md
          if ($status -ne 0) { exit 1 }
