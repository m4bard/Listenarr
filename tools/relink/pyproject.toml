[project]
name = "listenarr-relink"
version = "0.1.0"
description = "Plan and apply re-links of stale Listenarr AudiobookFiles paths to the files that really hold their content"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
listenarr-relink = "listenarr_relink.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "D105", "D107", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["listenarr_relink"]
